# git-cliff configuration for this fork's releases.
# https://git-cliff.org/docs/configuration
#
# Zellij itself does not use git-cliff. Its CHANGELOG.md is written by hand, so
# there is no upstream config to inherit and nothing here has to stay in step
# with an upstream file. This config exists only to turn the commits between two
# tags into the release notes for a fork build.
#
# The name is deliberate. A file called cliff.toml would collide if zellij ever
# adopts git-cliff, and a collision on a fork-only file is exactly what the
# branch model in LOCAL-RELEASES.md exists to avoid.
#
# The <!-- NN --> prefixes are sort keys, not content. They order the sections;
# the body template strips them with `striptags` before rendering the heading.
# They are compared as strings rather than numbers, so every one is two digits:
# a bare `10` would sort between `1` and `2` and put the catch-all group third.

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
#
# Each bullet takes only the first line of the message. For a conventional
# commit that is already all `message` holds, but for one that is not,
# git-cliff falls back to the entire raw message, body included, which would
# otherwise spill several paragraphs into a single list item.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace
trim = true
# postprocessors
postprocessors = [
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# Keep commits that are not conventional rather than dropping them.
#
# This fork's own commits are conventional, but a fork build also contains
# whatever arrived from upstream since the last tag, and zellij's history mixes
# conventional messages with plain ones such as "Minor fixes for 45 patch
# (#5550)". Dropping those would leave the notes claiming less went into the
# build than actually did. The catch-all parser at the end of commit_parsers
# collects them under "Other".
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
]
# regex for parsing and grouping commits
commit_parsers = [
  # Merge commits describe branch plumbing rather than a change to the program.
  # The commits they bring in are listed on their own.
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 02 -->Refactor" },
  { message = "^doc", group = "<!-- 03 -->Documentation" },
  { message = "^perf", group = "<!-- 04 -->Performance" },
  { message = "^style", group = "<!-- 05 -->Styling" },
  { message = "^test", group = "<!-- 06 -->Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 07 -->Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 08 -->Security" },
  { message = "^revert", group = "<!-- 09 -->Revert" },
  # Everything left over, which is how upstream's non-conventional commits
  # reach the notes. Must stay last: parsers are tried in order.
  { message = ".*", group = "<!-- 10 -->Other" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
#
# Left unset deliberately. Both the fork's fork-v* tags and the upstream v* tags
# restored from refs/upstream-tags/* have to count, so that a release's notes
# start at whichever tag actually precedes it.
# tag_pattern = "v[0-9].*"
# regex for skipping tags
# skip_tags = ""
# regex for ignoring tags
# ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
